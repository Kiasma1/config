"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
palette = "bootstrap"
format = "$directory$git_branch$git_commit$git_state$git_status$status$character"
right_format = "$cmd_duration"

[palettes.bootstrap]
accent = "#B45A56"
foreground = "#F5F5F5"
muted = "#8A8A8A"
error = "#D75F5F"

[directory]
format = "[$path$read_only](fg:accent)"
truncate_to_repo = false
truncation_length = 99
truncation_symbol = "…/"
read_only = " ro"

[git_branch]
symbol = ""
format = "[ · ](fg:muted)[git:](fg:foreground)[$branch](fg:accent)"
truncation_length = 99
truncation_symbol = ""

[git_commit]
only_detached = true
commit_hash_length = 7
format = "[ · ](fg:muted)[git:](fg:foreground)[$hash](fg:accent)"
tag_disabled = true

[git_state]
format = "[ · $state( $progress_current/$progress_total)](fg:muted)"

[git_status]
style = "fg:muted"
format = "([ · $all_status$ahead_behind]($style))"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[status]
disabled = false
format = "[ · exit:$status](fg:error)"

[cmd_duration]
min_time = 800
format = "[$duration](fg:muted)"

[character]
success_symbol = "[ λ ](fg:accent)"
error_symbol = "[ λ ](fg:error)"
vicmd_symbol = "[ λ ](fg:muted)"
